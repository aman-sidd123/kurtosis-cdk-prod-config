deployment_stages:
  deploy_l1: false
  deploy_agglayer_contracts_on_l1: true
  deploy_databases: true
  deploy_cdk_central_environment: true
  deploy_cdk_bridge_infra: true
  deploy_agglayer: true

args:
  sequencer_type: cdk-erigon
  consensus_contract_type: rollup
  additional_services: []
  l1_engine: anvil
  l1_chain_id: 31337
  l1_rpc_url: "http://host.docker.internal:8545"
  l1_ws_url: "ws://host.docker.internal:8545"
  l1_funding_amount: "5ether"
  zkevm_prover_image: hermeznetwork/zkevm-prover:v8.0.0-RC16-fork.12
  agglayer_contracts_image: europe-west2-docker.pkg.dev/prj-polygonlabs-devtools-dev/public/agglayer-contracts:v11.0.0

  # Fix 1: Use "latest" instead of "finalized" for Anvil
  zkevm_l1_highest_block_type: "latest"

  # Fix 2: Correct syntax (removed rogue quotes), wrapped values in quotes

  chain_name: "Amolygon"
  l2_chain_id: 123456789
  l2_network_id: 1

  # Fix 3: Explicitly set fork ID to match your prover image
  zkevm_fork_id: 12

  zkevm_use_real_verifier: false
  log_level: info
  log_format: json
